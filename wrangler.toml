# wrangler.toml
# Cloudflare Pages project configuration.
#
# Production uses bindings configured in the Cloudflare dashboard; this file
# documents the same bindings for local dev (`wrangler pages dev`) so the
# submit function behaves identically.

name = "business-evaluator"
compatibility_date = "2025-01-01"
pages_build_output_dir = "./"

# KV namespace used by functions/api/submit.js to persist submissions.
# Created via: wrangler kv namespace create SUBMISSIONS
# Then bind the resulting id below, or configure in the dashboard.
[[kv_namespaces]]
binding = "SUBMISSIONS_KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"