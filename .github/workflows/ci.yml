name: CI - Run tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax-check front-end JS
        run: node --check public/js/app.js && node --check public/js/data.js

      - name: Check consent gate wiring
        run: node .github/scripts/check-consent-wiring.mjs

      - name: Run Cloudflare function tests
        run: |
          node --check functions/api/submit.js
          npm test

      - name: Verify committed Worker bundle matches functions/
        run: |
          npm run build:worker
          git diff --exit-code -- dist/worker/index.js