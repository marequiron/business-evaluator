name: app-build

# Phase C — desktop installers for Windows/macOS/Linux from one matrix.
# Triggered on push to master, on tags (v*) and manually. Runs the test suite
# first, then builds per-OS bundles via tauri/tauri-action and publishes a
# draft GitHub Release with the artifacts. The existing Azure Static Web Apps
# workflow (.github/workflows/azure-static-web-apps.yml) is untouched.
on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  RUST_BACKTRACE: short

jobs:
  test:
    name: Front-end + API tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install front-end deps
        run: npm ci
      - name: Sync app bundle
        run: |
          npm run app:sync
          test -f src-tauri/app-dist/index.html
      - name: Front-end tests
        run: npm test
      - name: API unit tests
        working-directory: api
        run: |
          npm ci
          npm test

  build:
    name: Build (${{ matrix.platform }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
          - platform: macos-14
          - platform: windows-2022
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux system deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential \
            curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev rpm
      - name: Install front-end deps
        run: npm ci
      - name: Build the app, draft a Release with artifacts
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional — only needed for auto-update signing (Tauri updater).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: app-v__VERSION__
          releaseName: "Business Evaluator v__VERSION__"
          releaseBody: "See the assets below. Draft release (Phase C)."
          releaseDraft: true
          prerelease: false
